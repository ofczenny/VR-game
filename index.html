<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AoT ODM Demo</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

<div style="
position:fixed;
top:10px;
left:10px;
padding:8px 12px;
background:rgba(0,0,0,0.6);
color:white;
font-family:monospace;
border-radius:6px;
z-index:999;">
Q = Left Hook<br>
E = Right Hook<br>
SPACE = Gas Boost<br>
SHIFT + SPACE = Turbo Boost<br>
WASD = Move
</div>

<a-scene>

  <a-assets>
    <img id="floor" src="assets/images/floor.jpg">
    <a-asset-item id="robot" src="assets/models/robot.glb"></a-asset-item>
  </a-assets>

  <!-- PLAYER -->

  <a-entity
    id="rig"
    position="0 1.6 5"
    odm-gear>

    <a-entity
      camera
      look-controls
      wasd-controls>

      <!-- CROSSHAIR -->

      <a-entity
        position="0 0 -1"
        geometry="primitive:ring;
                  radiusInner:0.002;
                  radiusOuter:0.004"
        material="color:white;shader:flat">
      </a-entity>

      <!-- LEFT BLADE -->

      <a-box
        position="-0.25 -0.3 -0.5"
        width="0.03"
        height="0.5"
        depth="0.03"
        color="silver">
      </a-box>

      <!-- RIGHT BLADE -->

      <a-box
        position="0.25 -0.3 -0.5"
        width="0.03"
        height="0.5"
        depth="0.03"
        color="silver">
      </a-box>

    </a-entity>

  </a-entity>

  <!-- TEST ROBOT -->

  <a-entity
    gltf-model="#robot"
    class="grapple-target"
    position="0 0 -10">
  </a-entity>

  <!-- BUILDINGS -->

  <a-box class="grapple-target"
         position="0 10 -20"
         width="8"
         height="20"
         depth="8"
         color="#888">
  </a-box>
